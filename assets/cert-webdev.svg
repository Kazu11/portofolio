<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#fcfcfd" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#0284c7" stroke-width="4" rx="8" />
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#e2e8f0" stroke-width="1" rx="6" />

  <!-- Corner Decorations -->
  <path d="M 20 50 L 50 20 M 20 60 L 60 20 M 20 70 L 70 20" stroke="#0284c7" stroke-width="2" />
  <path d="M 780 50 L 750 20 M 780 60 L 740 20 M 780 70 L 730 20" stroke="#0284c7" stroke-width="2" />
  <path d="M 20 550 L 50 580 M 20 540 L 60 580 M 20 530 L 70 580" stroke="#0284c7" stroke-width="2" />
  <path d="M 780 550 L 750 580 M 780 540 L 740 580 M 780 530 L 730 580" stroke="#0284c7" stroke-width="2" />

  <!-- Badge / Emblem Graphic (Watermark Center Background) -->
  <circle cx="400" cy="300" r="120" fill="#0284c7" fill-opacity="0.03" />
  <polygon points="400,210 430,290 510,290 445,335 470,410 400,365 330,410 355,335 290,290 370,290" fill="#0284c7" fill-opacity="0.02" />

  <!-- Certificate Header -->
  <text x="400" y="90" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="4">SERTIFIKAT KOMPETENSI</text>
  <text x="400" y="120" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">BADAN NASIONAL SERTIFIKASI PROFESI</text>

  <!-- Divider Line -->
  <line x1="250" y1="145" x2="550" y2="145" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <polygon points="400,141 405,145 400,149 395,145" fill="#0284c7" />

  <!-- Given To Text -->
  <text x="400" y="195" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle" font-style="italic">Dengan ini menerangkan bahwa kompetensi diberikan kepada:</text>
  <text x="400" y="245" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#0284c7" text-anchor="middle">AHMAD RIFAI</text>
  <line x1="300" y1="260" x2="500" y2="260" stroke="#0284c7" stroke-width="1.5" />

  <!-- Achievement Text -->
  <text x="400" y="300" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Atas pencapaian luar biasa dalam memenuhi standar kompetensi industri:</text>
  <text x="400" y="340" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Web Developer Specialist</text>

  <!-- Details -->
  <text x="400" y="380" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">No. Registrasi Kredensial: WD-9921-X9 • Tanggal Terbit: Maret 2023</text>

  <!-- Signatures -->
  <!-- Left Signee -->
  <text x="180" y="475" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Prof. Dr. Ir. H. Sugiyono</text>
  <text x="180" y="495" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Ketua Komite Sertifikasi</text>
  <path d="M 140 450 Q 170 430 180 460 T 210 450" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Signee -->
  <text x="620" y="475" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Drs. Wahyu Hidayat, M.Kom</text>
  <text x="620" y="495" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Direktur Eksekutif</text>
  <path d="M 580 445 Q 610 460 630 435 T 650 455" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Decorative Golden Seal -->
  <g transform="translate(400,475)">
    <!-- Star rays background -->
    <path d="M 0 -25 L 7 -7 L 25 0 L 7 7 L 0 25 L -7 7 L -25 0 L -7 -7 Z" fill="#eab308" />
    <path d="M 0 -25 L 7 -7 L 25 0 L 7 7 L 0 25 L -7 7 L -25 0 L -7 -7 Z" fill="#fbbf24" transform="rotate(30)" />
    <path d="M 0 -25 L 7 -7 L 25 0 L 7 7 L 0 25 L -7 7 L -25 0 L -7 -7 Z" fill="#f59e0b" transform="rotate(60)" />
    <!-- Seal core circles -->
    <circle cx="0" cy="0" r="18" fill="#d97706" />
    <circle cx="0" cy="0" r="15" fill="#f59e0b" />
    <circle cx="0" cy="0" r="13" fill="#fbbf24" />
    <!-- Checkmark inside seal -->
    <path d="M -6 0 L -2 4 L 5 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
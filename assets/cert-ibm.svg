<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#fefefe" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#0284c7" stroke-width="4" rx="8" />
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#e2e8f0" stroke-width="1" rx="6" />

  <!-- Corner Decorations -->
  <path d="M 20 50 L 50 20 M 20 60 L 60 20 M 20 70 L 70 20" stroke="#0284c7" stroke-width="2" />
  <path d="M 780 50 L 750 20 M 780 60 L 740 20 M 780 70 L 730 20" stroke="#0284c7" stroke-width="2" />
  <path d="M 20 550 L 50 580 M 20 540 L 60 580 M 20 530 L 70 580" stroke="#0284c7" stroke-width="2" />
  <path d="M 780 550 L 750 580 M 780 540 L 740 580 M 780 530 L 730 580" stroke="#0284c7" stroke-width="2" />

  <!-- Watermark Center Background -->
  <circle cx="400" cy="300" r="120" fill="#0284c7" fill-opacity="0.03" />

  <!-- Certificate Header -->
  <text x="400" y="95" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="3">SERTIFIKAT KOMPETENSI</text>
  <text x="400" y="125" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">IBM</text>

  <!-- Divider Line -->
  <line x1="250" y1="150" x2="550" y2="150" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <polygon points="400,146 405,150 400,154 395,150" fill="#0284c7" />

  <!-- Given To Text -->
  <text x="400" y="200" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle" font-style="italic">Dengan ini menerangkan bahwa:</text>
  <text x="400" y="250" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0284c7" text-anchor="middle">ABDULLAH FAQIH</text>
  <line x1="280" y1="265" x2="520" y2="265" stroke="#0284c7" stroke-width="2" />

  <!-- Achievement Text -->
  <text x="400" y="305" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Telah menyelesaikan program dan dinyatakan kompeten pada:</text>
  <text x="400" y="345" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">IBM Certified Professional</text>

  <!-- Details -->
  <text x="400" y="385" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">No. Kredensial: IBM-9902-I1 • Tanggal Terbit: September 2023</text>

  <!-- Signatures -->
  <!-- Left Signee -->
  <text x="200" y="480" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Dewan Penguji / Direktur</text>
  <text x="200" y="498" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">IBM</text>
  <path d="M 160 455 Q 190 440 205 470 T 225 445" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />

  <!-- Right Signee -->
  <text x="600" y="480" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Verifikasi Keaslian</text>
  <text x="600" y="498" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Sistem Kredensial Resmi</text>
  <path d="M 560 450 Q 590 460 605 440 T 625 455" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Decorative Seal -->
  <g transform="translate(400,480)">
    <path d="M 0 -22 L 6 -6 L 22 0 L 6 6 L 0 22 L -6 6 L -22 0 L -6 -6 Z" fill="#eab308" />
    <path d="M 0 -22 L 6 -6 L 22 0 L 6 6 L 0 22 L -6 6 L -22 0 L -6 -6 Z" fill="#fbbf24" transform="rotate(30)" />
    <circle cx="0" cy="0" r="16" fill="#0284c7" />
    <circle cx="0" cy="0" r="13" fill="#38bdf8" />
    <path d="M -5 0 L -1 4 L 5 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
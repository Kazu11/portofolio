  <line x1="80" y1="274" x2="720" y2="274" stroke="#f1f5f9" stroke-width="1" />

  <text x="80" y="304" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#334155">3. Tactical Driving &amp; Convoy Operations</text>
